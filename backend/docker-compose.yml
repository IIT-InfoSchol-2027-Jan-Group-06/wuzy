services:
  api:
    build: .
    # Mount source code for hot reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    # Load environment variables
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, seed data, then start server
    command: >
      sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wuzy
      # Use locale available in alpine to avoid slow/missing locale init
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
