services:
  api:
    build: .
    # Mount source code for hot reload
    volumes:
      - .:/app:z
    ports:
      - "8000:8000"
    # Load environment variables
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Ensure the database exists (stale postgres volumes skip init), then
    # apply migrations, seed data, and start the server
    command: >
      sh -c "python docker/ensure-db.py && alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:16-alpine
    # Named volume so data survives restarts and `docker compose down`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wuzy
      # Use locale available in alpine to avoid slow/missing locale init
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
